<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ExamSaathi</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f5f9;font-family:Arial,sans-serif;color:#222}
header{background:#0756d6;color:#fff;text-align:center;padding:14px}
header h1{margin:0;font-size:25px}
header p{margin:4px 0 0}
.page{max-width:700px;margin:auto;padding:10px}
.screen{display:none}
.screen.active{display:block}
.card{background:#fff;border-radius:12px;padding:15px;margin-bottom:10px;box-shadow:0 2px 8px #0001}
button{border:0;border-radius:8px;padding:13px;margin:5px 0;font-size:16px;font-weight:bold;cursor:pointer;width:100%}
.blue{background:#0756d6;color:#fff}
.orange{background:#f47700;color:#fff}
.gray{background:#e5e9ef;color:#222}
.lang{display:flex;gap:8px}
.lang button{margin:0}
.lang .selected{background:#0756d6;color:#fff}
.top{position:sticky;top:0;z-index:10}
.info{display:flex;justify-content:space-between;background:#fff;padding:10px;border-radius:9px;font-weight:bold}
#timer{color:red}
.palette{background:#fff;padding:8px;border-radius:9px;margin:8px 0}
.paletteHead{font-size:13px;margin-bottom:5px;display:flex;justify-content:space-between}
#palette{display:flex;flex-wrap:wrap;gap:3px}
#palette button{width:27px;height:27px;padding:0;margin:0;font-size:11px;background:#e5e9ef}
#palette button.done{background:#36a852;color:#fff}
#palette button.now{outline:2px solid #0756d6}
.subject{font-size:14px;color:#0756d6;font-weight:bold;margin-bottom:8px}
.question{font-size:19px;font-weight:bold;line-height:1.45;margin-bottom:10px}
.option{text-align:left;background:#f7f8fa;border:2px solid #ddd}
.option.chosen{border-color:#0756d6;background:#e5edff}
.nav{display:flex;gap:7px}
.nav button{flex:1}
.result{text-align:center}
.score{font-size:46px;font-weight:bold;color:#f47700}
.stat{padding:10px;background:#f1f4f7;margin:6px 0;border-radius:7px}
</style>
</head>

<body>

<header>
<h1>🎯 ExamSaathi</h1>
<p>Mock Test App</p>
</header>

<div class="page">

<!-- HOME -->
<section id="home" class="screen active">
<div class="card">
<h2>📚 परीक्षा चुनें</h2>
<button class="blue" onclick="openExam('ssc')">SSC</button>
<button class="blue" onclick="openExam('up')">UP Police</button>
</div>
</section>

<!-- SSC -->
<section id="ssc" class="screen">
<div class="card">
<button class="gray" onclick="go('home')">⬅ वापस</button>
<h2>SSC</h2>
<button class="orange" onclick="openTestList('SSC GD')">SSC GD</button>
<button class="orange" onclick="alert('SSC CGL जल्द उपलब्ध होगा')">SSC CGL</button>
<button class="orange" onclick="alert('SSC CHSL जल्द उपलब्ध होगा')">SSC CHSL</button>
</div>
</section>

<!-- UP POLICE -->
<section id="up" class="screen">
<div class="card">
<button class="gray" onclick="go('home')">⬅ वापस</button>
<h2>UP Police</h2>
<button class="orange" onclick="alert('UP Police Constable जल्द उपलब्ध होगा')">Constable</button>
<button class="orange" onclick="alert('UP Police SI जल्द उपलब्ध होगा')">SI</button>
</div>
</section>

<!-- TEST LIST -->
<section id="tests" class="screen">
<div class="card">
<button class="gray" onclick="go('ssc')">⬅ वापस</button>
<h2 id="examTitle">SSC GD</h2>

<p><b>भाषा चुनें / Select Language</b></p>

<div class="lang">
<button id="hindiBtn" class="selected" onclick="language='hi';selectLang()">हिंदी</button>
<button id="englishBtn" onclick="language='en';selectLang()">English</button>
</div>

<p>📝 80 Questions &nbsp; | &nbsp; ⏱️ 60 Minutes</p>

<button class="orange" onclick="start(1)">Mock Test 1</button>
<button class="orange" onclick="start(2)">Mock Test 2</button>
<button class="orange" onclick="start(3)">Mock Test 3</button>
</div>
</section>

<!-- QUIZ -->
<section id="quiz" class="screen">

<div class="top">

<div class="info">
<span id="qno">Question 1/80</span>
<span id="timer">60:00</span>
</div>

<div class="palette">
<div class="paletteHead">
<span>Question Palette</span>
<span id="count">0/80</span>
</div>
<div id="palette"></div>
</div>

</div>

<div class="card">

<div id="subject" class="subject"></div>

<div id="question" class="question"></div>

<div id="options"></div>

</div>

<div class="nav">
<button class="gray" onclick="prev()">⬅ Previous</button>
<button class="blue" onclick="next()">Next ➡</button>
</div>

<button class="orange" onclick="submitTest()">✅ Submit Test</button>

</section>

<!-- RESULT -->
<section id="result" class="screen">
<div class="card result">

<h2>🏆 Test Result</h2>

<div id="score" class="score">0/80</div>

<div id="correct" class="stat"></div>
<div id="wrong" class="stat"></div>
<div id="skip" class="stat"></div>
<div id="percent" class="stat"></div>

<button class="orange" onclick="reattempt()">🔄 Reattempt</button>
<button class="blue" onclick="go('tests')">📚 Other Tests</button>
<button class="gray" onclick="go('home')">🏠 Home</button>

</div>
</section>

</div>

hi:{

/* ===============================
SCREENS
================================ */

function go(id){

document.querySelectorAll(".screen").forEach(function(x){
x.classList.remove("active");
});

document.getElementById(id).classList.add("active");

window.scrollTo(0,0);
}


function openExam(id){
go(id);
}


function openTestList(name){

document.getElementById("examTitle").innerText=name;
go("tests");

}


function selectLang(){

document.getElementById("hindiBtn").classList.toggle("selected",language==="hi");
document.getElementById("englishBtn").classList.toggle("selected",language==="en");

}


/* ===============================
START
================================ */

function start(test){

selectedTest=test;

questions=makeQuestions(test);

answers=new Array(80).fill(null);

current=0;

time=3600;

go("quiz");

createPalette();

showQuestion();

clearInterval(timer);

timer=setInterval(function(){

time--;

showTime();

if(time<=0){

clearInterval(timer);

submitTest();

}

},1000);

showTime();

}


/* ===============================
QUESTION
================================ */

function showQuestion(){

let q=questions[current];

let data=language==="hi"?q.hi:q.en;

document.getElementById("qno").innerText=
"Question "+(current+1)+"/80";

document.getElementById("subject").innerText=
"📚 "+q.subject;

document.getElementById("question").innerText=data.q;

let box=document.getElementById("options");

box.innerHTML="";

data.o.forEach(function(text,index){

let b=document.createElement("button");

b.className="option";

if(answers[current]===index)
b.classList.add("chosen");

b.innerText=
String.fromCharCode(65+index)+". "+text;

b.onclick=function(){

answers[current]=index;

showQuestion();

};

box.appendChild(b);

});

updatePalette();

}


/* ===============================
PALETTE
================================ */

function createPalette(){

let p=document.getElementById("palette");

p.innerHTML="";

for(let i=0;i<80;i++){

let b=document.createElement("button");

b.innerText=i+1;

b.onclick=function(){

current=i;

showQuestion();

};

p.appendChild(b);

}

}


function updatePalette(){

let buttons=document.querySelectorAll("#palette button");

let done=0;

buttons.forEach(function(b,i){

b.classList.remove("done","now");

if(answers[i]!==null){

b.classList.add("done");
done++;

}

if(i===current)
b.classList.add("now");

});

document.getElementById("count").innerText=done+"/80";

}


/* ===============================
NEXT PREVIOUS
================================ */

function next(){

if(current<79){

current++;
showQuestion();

}else{

alert("यह अंतिम प्रश्न है। Submit Test दबाएँ।");

}

}


function prev(){

if(current>0){

current--;
showQuestion();

}else{

alert("यह पहला प्रश्न है।");

}

}


/* ===============================
TIMER
================================ */

function showTime(){

let m=Math.floor(time/60);
let s=time%60;

document.getElementById("timer").innerText=
String(m).padStart(2,"0")+":"+
String(s).padStart(2,"0");

}


/* ===============================
SUBMIT
================================ */

function submitTest(){

clearInterval(timer);

let correct=0;
let wrong=0;
let skipped=0;

for(let i=0;i<80;i++){

if(answers[i]===null){

skipped++;

}else if(answers[i]===questions[i].a){

correct++;

}else{

wrong++;

}

}

let percentage=Math.round(correct/80*100);

document.getElementById("score").innerText=
correct+"/80";

document.getElementById("correct").innerText=
"✅ सही उत्तर: "+correct;

document.getElementById("wrong").innerText=
"❌ गलत उत्तर: "+wrong;

document.getElementById("skip").innerText=
"⏭️ छोड़े गए: "+skipped;

document.getElementById("percent").innerText=
"📊 प्रतिशत: "+percentage+"%";

go("result");

}


function reattempt(){

start(selectedTest);

}

</script>

</body>
</html>
